name: Refresh profile cards

# The cards in assets/ are files in this repository rather than images pulled
# from a rendering service when someone opens the profile: the public
# github-readme-stats instance answers 503 often enough to leave a profile
# full of broken images. This job keeps the numbers current instead.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/render_cards.py'
      - '.github/workflows/refresh-cards.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Redraw cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_cards.py

      - name: Commit if anything changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          git diff --staged --quiet && echo 'cards unchanged' && exit 0
          git commit -m 'chore: refresh profile cards'
          git push
